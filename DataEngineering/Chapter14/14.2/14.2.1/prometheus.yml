version: '3.8'
# docker-compose 規格版本
# 3.8 是目前最常見、與 Docker 20+ / Swarm / WSL 都相容的版本

services:
  prometheus:
    image: prom/prometheus:v2.52.0
    # 使用 Prometheus 官方映像
    # v2.52.0 為新格式（OCI / schema2），可避免 Docker deprecated image 警告

    container_name: prometheus
    # 指定容器名稱，方便使用 docker ps / docker logs prometheus 查看

    volumes:
      - prometheus_data:/prometheus
      # 將 Prometheus 的資料目錄掛載成 Docker volume
      # 用來保存時間序列資料（TSDB）
      # 即使容器刪除，資料仍會保留

    ports:
      - target: 9090
        published: 9090
        mode: host
        # 將容器內的 9090（Prometheus Web UI）
        # 直接對外開在主機的 9090 port
        # 瀏覽器可用 http://localhost:9090 存取

    user: root
    # 以 root 身份執行容器
    # 教學環境可保留，正式環境可移除以提升安全性

    restart: always
    # 當容器異常停止或主機重開時，自動重新啟動

    networks:
      - my_network
      # 指定使用自訂 Docker network

networks:
  my_network:
  # 定義自訂 Docker network
  # 用來隔離並管理這組監控服務

volumes:
  prometheus_data:
  # Prometheus 資料 volume（TSDB）
