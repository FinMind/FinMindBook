version: '3.8'
services:
  initdb:
    image: linsamtw/dataflow3:14.3.4
    command: uv run --env-file=.env airflow db init
    restart: on-failure
    # swarm 設定
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints: [node.labels.airflow==true]
    networks:
        - my_network

  create-user:
    image: linsamtw/dataflow3:14.3.4
    command: uv run --env-file=.env airflow users create --username admin --firstname lin --lastname sam --role Admin -p admin --email finmind.tw@gmail.com
    depends_on:
      - initdb
      - airflow-statsd-exporter
    restart: on-failure
    # swarm 設定
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints: [node.labels.airflow==true]
    networks:
        - my_network

  redis:
    image: 'bitnami/redis:latest'
    ports:
        - 6379:6379
    volumes:
        - 'redis_data:/bitnami/redis/data'
    environment:
        - ALLOW_EMPTY_PASSWORD=yes
    restart: always
    # swarm 設定
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints: [node.labels.airflow==true]
    networks:
        - my_network

  webserver:
    image: linsamtw/dataflow3:14.3.4
    hostname: "airflow-webserver"
    command: uv run --env-file=.env airflow webserver -p 8888
    depends_on:
      - initdb
      - airflow-statsd-exporter
    restart: always
    ports:
        - 8888:8888
    environment:
      - TZ=Asia/Taipei
      - AIRFLOW__SCHEDULER__STATSD_ON=True
      - AIRFLOW__SCHEDULER__STATSD_HOST=airflow-statsd-exporter
      - AIRFLOW__SCHEDULER__STATSD_PORT=8125
      - AIRFLOW__SCHEDULER__STATSD_PREFIX=airflow
    # swarm 設定
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints: [node.labels.airflow==true]
    networks:
        - my_network

  flower:
    image: mher/flower:0.9.5
    restart: always
    depends_on:
      - redis
      - airflow-statsd-exporter
    command: ["flower", "--broker=redis://redis:6379/0", "--port=5555"]
    ports:
        - "5556:5555"
    # swarm 設定
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints: [node.labels.airflow==true]
    networks:
        - my_network
  
  scheduler:
    image: linsamtw/dataflow3:14.3.4
    hostname: "airflow-scheduler"
    command: uv run --env-file=.env airflow scheduler
    depends_on:
      - initdb
      - airflow-statsd-exporter
    restart: always
    environment:
      - TZ=Asia/Taipei
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    # swarm 設定
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints: [node.labels.airflow==true]
    networks:
        - my_network

  worker:
    image: linsamtw/dataflow3:14.3.4
    restart: always
    depends_on:
      - scheduler
      - airflow-statsd-exporter
    hostname: "worker-{{.Task.Slot}}"
    # 直接在 command 帶入參數，Swarm 會在啟動時自動把 {{...}} 換成實際的編號
    command: sh -c "exec uv run --env-file=.env airflow celery worker -H $${HOSTNAME}"
    # swarm 設定
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints: [node.labels.worker==true]
    networks:
        - my_network

  crawler_twse:
    image: linsamtw/dataflow3:14.3.4
    hostname: "{{.Service.Name}}.{{.Task.Slot}}"
    restart: always
    depends_on:
      - scheduler
      - airflow-statsd-exporter
    # 直接在 command 帶入參數，Swarm 會在啟動時自動把 {{...}} 換成實際的編號
    command: sh -c "exec uv run --env-file=.env airflow celery worker  --queues twse -H $${HOSTNAME}"
    # swarm 設定
    deploy:
      mode: replicated
      replicas: 1
      placement:
        max_replicas_per_node: 1
        constraints: [node.labels.crawler_twse==true]
    networks:
        - my_network

  crawler_tpex:
    image: linsamtw/dataflow3:14.3.4
    hostname: "{{.Service.Name}}.{{.Task.Slot}}"
    restart: always
    depends_on:
      - scheduler
      - airflow-statsd-exporter
    # 直接在 command 帶入參數，Swarm 會在啟動時自動把 {{...}} 換成實際的編號
    command: sh -c "exec uv run --env-file=.env airflow celery worker  --queues twse -H $${HOSTNAME}"
    # swarm 設定
    deploy:
      mode: replicated
      replicas: 1
      placement:
        max_replicas_per_node: 1
        constraints: [node.labels.crawler_tpex==true]
    networks:
        - my_network

networks:
  my_network:
    external: true

volumes:
  redis_data: