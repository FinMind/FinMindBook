version: '3.0'
services:
  scheduler:
    image: linsamtw/crawler3:7.2.1
    hostname: "twse"
    command: uv run --env-file=.env python -m financialdata.scheduler
    restart: always
    # swarm 設定
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints: [node.labels.crawler_scheduler == true]
    environment:
      - TZ=Asia/Taipei
    networks:
        - my_network

networks:
  my_network:
    # 加入已經存在的網路
    external: true
